name: Build MARSA Agent

on:
  push:
    branches: [ main ]

jobs:
  build:

    runs-on: windows-latest

    steps:

    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: "1.24"

    - run: go mod tidy

    - run: go build -ldflags="-s -w" -o agent.exe

    - uses: actions/upload-artifact@v4
      with:
        name: MARSA-Agent
        path: agent.exe